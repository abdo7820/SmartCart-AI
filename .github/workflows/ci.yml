name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartcart
          POSTGRES_PASSWORD: smartcart
          POSTGRES_DB: smartcart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartcart" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=src pytest -q
      - run: PYTHONPATH=src pytest -q
        env:
          TEST_PG_URL: postgresql://smartcart:smartcart@localhost:5432/smartcart_test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t smartcart-api .
